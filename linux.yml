name: Linux CI

on: [push, pull_request]

jobs:
  build:
    name: x64
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        set -eux
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libsdl2-dev \
          libgnutls28-dev \
          libmad0-dev \
          libopus-dev \
          libopusfile-dev \
          libvorbis-dev \
          zlib1g-dev \
          libcurl4-openssl-dev \
          zip

    - name: Verify gnutls
      run: |
        set -eux
        pkg-config --exists gnutls
        echo "gnutls found: $(pkg-config --modversion gnutls)"
        pkg-config --cflags --libs gnutls

    - name: Build
      run: |
        chmod 755 build-linux.sh
        ./build-linux.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: QSS-M
        path: |
          Quake/QSS-M-l64.zip
