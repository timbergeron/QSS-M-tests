name: macOS CI (Xcode)

on:
  push
  pull_request

jobs:
  build:
    name: arm64-universal
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Homebrew dependencies
      run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null || true)"
          brew install autoconf automake libtool pkg-config autoconf-archive

    - name: Log GNUTLS visibility
      run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null || true)"
          echo "pkg-config path: $(command -v pkg-config || true)"
          if pkg-config --exists gnutls; then
            echo "gnutls found: $(pkg-config --modversion gnutls)"
            pkg-config --cflags --libs gnutls
          else
            echo "gnutls not found via pkg-config (expected if using vcpkg-provided static libs)."
          fi

    - name: Build
      run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null || true)"
          cd MacOSX
          ./build-macos.sh

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: QSS-M
        path: |
          MacOSX/build/Release/*.zip
