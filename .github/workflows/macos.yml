name: macOS CI (Xcode)

on:
  push:
  pull_request:

jobs:
  build:
    name: arm64-universal
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      id: vcpkg-cache
      with:
        path: |
          MacOSX/vcpkg/installed
          MacOSX/libs_universal
        key: vcpkg-macos-${{ runner.os }}-${{ runner.arch }}-xcode${{ hashFiles('/Applications/Xcode*.app/Contents/version.plist') }}-${{ hashFiles('MacOSX/setup-vcpkg.sh', 'MacOSX/custom-triplets/**') }}

    - name: Setup Homebrew and install dependencies
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [ -x /usr/local/bin/brew ]; then
            eval "$(/usr/local/bin/brew shellenv)"
          else
            echo "ERROR: brew not found!"
            exit 1
          fi
          brew install autoconf automake libtool pkg-config autoconf-archive

    - name: Build
      run: |
          eval "$(/opt/homebrew/bin/brew shellenv 2>/dev/null || /usr/local/bin/brew shellenv 2>/dev/null || true)"
          cd MacOSX
          if [ "${{ steps.vcpkg-cache.outputs.cache-hit }}" = "true" ]; then
            export SKIP_VCPKG_SETUP=1
          fi
          ./build-macos.sh

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: QSS-M
        path: |
          MacOSX/build/Release/*.zip
