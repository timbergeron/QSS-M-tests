name: macOS CI (Cross-Compile Windows)

on: [push, pull_request]

jobs:
  build-windows:
    name: Windows ${{ matrix.platform }} (from macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: w64
            arch: x86_64
            makefile: Makefile.w64
          - platform: w32
            arch: i686
            makefile: Makefile.w32

    steps:
    - uses: actions/checkout@v4

    - name: Install MinGW Cross-Compiler
      run: |
        brew install mingw-w64

    - name: Generate QSS-M Revision Info
      run: |
        echo "Git URL:      https://github.com/timbergeron/QSS-M.git" > QSS-M-Revision.txt
        echo "Git Revision: $(git rev-parse HEAD)" >> QSS-M-Revision.txt
        echo "Git Date:     $(git log -1 --date=short --format=%cd)" >> QSS-M-Revision.txt
        echo "Compile Date: $(date)" >> QSS-M-Revision.txt
        export SOURCE_DATE_EPOCH=$(git log -1 --date=short --format=%ct)

    - name: Build Windows Binary
      run: |
        cd Quake || exit 1
        
        echo "=== Debugging file structure ==="
        ls -F ../Windows/zlib/ || echo "Windows/zlib not found"
        echo "=============================="
        
        # Prepare local include directory
        mkdir -p local_include
        
        # Check for existing zlib headers, otherwise download them
        if [ -f "../Windows/zlib/include/zlib.h" ]; then
          echo "Found zlib headers in repo."
          cp ../Windows/zlib/include/*.h local_include/
        else
          echo "zlib headers NOT found in repo. Downloading..."
          curl -sL -o local_include/zlib.h https://raw.githubusercontent.com/madler/zlib/master/zlib.h
          curl -sL -o local_include/zconf.h https://raw.githubusercontent.com/madler/zlib/master/zconf.h
          # zconf.h usually needs configuration, but for MinGW cross-compile stock might work or need tweaks.
          # Better source: MSYS2's zconf might be safer, but let's try standard first or standard repo fallback.
        fi
        
        ls -l local_include/
        
        # Add local include path
        export QSS_CFLAGS="-DQSS_REVISION=$(git rev-parse HEAD) -Ilocal_include"
        export QSS_LDFLAGS="-Wl,--allow-multiple-definition"
        
        # Set cross-compiler variables based on platform
        if [ "${{ matrix.platform }}" = "w64" ]; then
          TARGET=x86_64-w64-mingw32
          ZLIB_PLATFORM="x64"
        else
          TARGET=i686-w64-mingw32
          ZLIB_PLATFORM="x86"
        fi
        
        # Linker trick: Makefile looks for libz.a.
        # We copy our zlib DLL (or import lib) to 'libz.a' in the current dir so the linker finds it.
        cp "../Windows/zlib/${ZLIB_PLATFORM}/zlib1.dll" libz.a
        
        # Pass cross-compiler tools directly to make (Makefile defaults CC=gcc otherwise)
        make -f ${{ matrix.makefile }} USE_SDL2=1 \
          CC=${TARGET}-gcc \
          AR=${TARGET}-ar \
          RANLIB=${TARGET}-ranlib \
          WINDRES=${TARGET}-windres \
          STRIP=${TARGET}-strip \
          -j$(sysctl -n hw.ncpu)
        mv quakespasm.exe QSS-M-${{ matrix.platform }}.exe

    - name: Package Windows Binary
      run: |
        cd Quake
        if [ "${{ matrix.platform }}" = "w64" ]; then
          zip -9j QSS-M-${{ matrix.platform }}.zip \
            ../Windows/codecs/x64/*.dll \
            ../Windows/curl/lib/x64/libcurl.dll \
            ../Windows/zlib/x64/zlib1.dll \
            ../LICENSE.txt \
            ../Quakespasm.html \
            quakespasm.pak \
            qssm.pak \
            ../Quakespasm.txt \
            ../Quakespasm-Spiked.txt \
            ../Quakespasm-Music.txt \
            ../Windows/SDL2/lib64/SDL2.dll \
            ../QSS-M-Revision.txt \
            QSS-M-${{ matrix.platform }}.exe
        else
          zip -9j QSS-M-${{ matrix.platform }}.zip \
            ../Windows/codecs/x86/*.dll \
            ../Windows/curl/lib/x86/libcurl.dll \
            ../Windows/zlib/x86/zlib1.dll \
            ../LICENSE.txt \
            ../Quakespasm.html \
            quakespasm.pak \
            qssm.pak \
            ../Quakespasm.txt \
            ../Quakespasm-Spiked.txt \
            ../Quakespasm-Music.txt \
            ../Windows/SDL2/lib/SDL2.dll \
            ../QSS-M-Revision.txt \
            QSS-M-${{ matrix.platform }}.exe
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: QSS-M-${{ matrix.platform }}-macos-cross
        path: Quake/QSS-M-${{ matrix.platform }}.zip

  build-linux:
    name: Linux x64 (from macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux Cross-Compiler
      run: |
        brew install filosottile/musl-cross/musl-cross
        # Ensure we have wget/tar/make (standard on macos images but good to be sure)

    - name: Build zlib (Static Linux)
      run: |
        mkdir -p linux-deps
        wget https://zlib.net/zlib-1.3.1.tar.gz
        tar xf zlib-1.3.1.tar.gz
        cd zlib-1.3.1
        
        # Configure for Musl
        # zlib configure script detects system 'libtool' on macOS and tries to use it.
        # We must override it to use the cross-compiler's 'ar' and 'ranlib'.
        export CC=x86_64-linux-musl-gcc
        export AR=x86_64-linux-musl-ar
        export RANLIB=x86_64-linux-musl-ranlib
        
        # Force "Linux" detection (zlib configure uses uname)
        # We can pass uname=Linux to trick it if needed, or just set generic args
        # But explicitly setting ARFLAGS=rc fixes the build issue where it expects libtool semantics (-o)
        ./configure \
          --static \
          --prefix=$(pwd)/../linux-deps
        
        make -j$(sysctl -n hw.ncpu) AR="${AR}" RANLIB="${RANLIB}" ARFLAGS=rc
        make install

    - name: Build Curl (Minimal Static Linux)
      run: |
        mkdir -p linux-deps
        wget https://curl.se/download/curl-8.5.0.tar.gz
        tar xf curl-8.5.0.tar.gz
        cd curl-8.5.0
        
        # Configure minimal curl (no SSL, no LDAP) for static linking
        CC=x86_64-linux-musl-gcc \
        ./configure \
          --host=x86_64-linux-musl \
          --disable-shared \
          --enable-static \
          --disable-ldap \
          --disable-ldaps \
          --without-ssl \
          --without-libidn2 \
          --without-brotli \
          --without-zstd \
          --prefix=$(pwd)/../linux-deps
        
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Build SDL2 (Static Linux)
      run: |
        mkdir -p linux-deps
        wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.0/SDL2-2.30.0.tar.gz
        tar xf SDL2-2.30.0.tar.gz
        cd SDL2-2.30.0
        
        # Configure for Musl Linux
        ./configure \
          --host=x86_64-linux-musl \
          --disable-shared \
          --enable-static \
          --disable-video-wayland \
          --disable-video-x11 \
          --disable-pulseaudio \
          --disable-esd \
          --disable-arts \
          --disable-nas \
          --disable-sndio \
          --disable-fusionsound \
          --prefix=$(pwd)/../linux-deps
        
        # Build SDL2
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Build libogg (Linux)
      run: |
        curl -LO https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz
        tar -xf libogg-1.3.5.tar.xz
        cd libogg-1.3.5
        ./configure --host=x86_64-linux-musl --prefix=$(pwd)/../linux-deps --disable-shared
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Build libvorbis (Linux)
      run: |
        curl -LO https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
        tar -xf libvorbis-1.3.7.tar.xz
        cd libvorbis-1.3.7
        ./configure --host=x86_64-linux-musl --prefix=$(pwd)/../linux-deps --disable-shared --with-ogg=$(pwd)/../linux-deps
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Build libmad (Linux)
      run: |
        curl -LO https://downloads.sourceforge.net/mad/libmad-0.15.1b.tar.gz
        tar -xf libmad-0.15.1b.tar.gz
        cd libmad-0.15.1b
        # Update ancient config.guess/sub to recognize modern macOS
        curl -L -o config.guess 'https://git.savannah.gnu.org/cgit/config.git/plain/config.guess'
        curl -L -o config.sub 'https://git.savannah.gnu.org/cgit/config.git/plain/config.sub'
        # Fix obsolete gcc flag (-fforce-mem is removed in GCC 4.4+)
        sed -i '' 's/-fforce-mem//' configure
        ./configure --host=x86_64-linux-musl --prefix=$(pwd)/../linux-deps --disable-shared
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Build libFLAC (Linux)
      run: |
        curl -LO https://downloads.xiph.org/releases/flac/flac-1.4.3.tar.xz
        tar -xf flac-1.4.3.tar.xz
        cd flac-1.4.3
        ./configure --host=x86_64-linux-musl --prefix=$(pwd)/../linux-deps --disable-shared --with-ogg=$(pwd)/../linux-deps --disable-cpplibs
        make -j$(sysctl -n hw.ncpu)
        make install

    - name: Create Dummy OpenGL Stub (Linux)
      run: |
        # Create a dummy libGL.so to satisfy the linker (-lGL).
        # We also pass -Wl,--unresolved-symbols=ignore-all to the linker so we don't need real symbols.
        mkdir -p linux-deps/lib
        echo "void glBegin(){}" | x86_64-linux-musl-gcc -fPIC -shared -o linux-deps/lib/libGL.so -xc -

    - name: Generate QSS-M Revision Info
      run: |
        echo "Git URL:      https://github.com/timbergeron/QSS-M.git" > QSS-M-Revision.txt
        echo "Git Revision: $(git rev-parse HEAD)" >> QSS-M-Revision.txt
        echo "Git Date:     $(git log -1 --date=short --format=%cd)" >> QSS-M-Revision.txt
        echo "Compile Date: $(date)" >> QSS-M-Revision.txt
        export SOURCE_DATE_EPOCH=$(git log -1 --date=short --format=%ct)

    - name: Build Linux Binary
      run: |
        cd Quake || exit 1
        
        export QSS_CFLAGS="-DQSS_REVISION=$(git rev-parse HEAD)"
        
        # Point to our custom SDL2 and zlib
        export PATH="$(pwd)/../linux-deps/bin:$PATH"
        export PKG_CONFIG_PATH="$(pwd)/../linux-deps/lib/pkgconfig"
        
        # Add include/lib paths manually to CFLAGS/LDFLAGS so compiler finds them
        export CFLAGS="-I$(pwd)/../linux-deps/include"
        # --unresolved-symbols=ignore-all tells the linker to ignore missing symbols (like glBegin)
        # This is safe because Quake loads GL dynamically via SDL at runtime.
        export LDFLAGS="-L$(pwd)/../linux-deps/lib -Wl,--unresolved-symbols=ignore-all"
        
        # Configure SDL config path manually just to be safe if pkg-config acts up
        SDL_CONFIG="$(pwd)/../linux-deps/bin/sdl2-config"
        
        # Build!
        # Resetting variables to avoid contamination
        # Disabling codecs for first pass
        make clean
        make USE_SDL2=1 LINUX_CROSS=1 \
          CC=x86_64-linux-musl-gcc \
          SDL_CONFIG="${SDL_CONFIG}" \
          LDFLAGS="${LDFLAGS}" \
          USE_CODEC_WAVE=1 \
          USE_CODEC_FLAC=1 \
          USE_CODEC_MP3=1 \
          USE_CODEC_VORBIS=1 \
          USE_CODEC_OPUS=0 \
          USE_CODEC_XMP=0 \
          USE_CODEC_UMX=0 \
          -j$(sysctl -n hw.ncpu)
          
        mv quakespasm QSS-M-l64

    - name: Package Linux Binary
      run: |
        cd Quake
        zip -9j QSS-M-l64.zip \
          ../LICENSE.txt \
          ../Quakespasm.html \
          quakespasm.pak \
          qssm.pak \
          ../Quakespasm.txt \
          ../Quakespasm-Spiked.txt \
          ../Quakespasm-Music.txt \
          ../QSS-M-Revision.txt \
          QSS-M-l64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: QSS-M-l64-macos-cross
        path: Quake/QSS-M-l64.zip
