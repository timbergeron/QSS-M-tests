name: Build Release

on:
  push:
    tags: ['v*']
  pull_request:

env:
  COMMON_DEPS: >-
    mingw-w64 
    libsdl2-dev 
    libmad0-dev 
    libopus-dev 
    libvorbis-dev 
    zlib1g-dev 
    libvorbisfile3 
    libopusfile-dev 
    libz-mingw-w64 
    libz-mingw-w64-dev 
    libcurl4-openssl-dev 
    zip

jobs:
  linux-windows-build:
    name: Build ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux
            build-script: build-linux.sh
            artifact-name: QSS-M-linux
            artifact-zip: Quake/QSS-M-l64.zip
          - name: Windows-64
            build-script: build-w64.sh
            artifact-name: QSS-M-w64
            artifact-zip: Quake/QSS-M-w64.zip
          - name: Windows-32
            build-script: build-w32.sh
            artifact-name: QSS-M-w32
            artifact-zip: Quake/QSS-M-w32.zip

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Build Cache
      - name: Setup Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
          key: ${{ runner.os }}-build-${{ matrix.config.name }}-${{ hashFiles('**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.config.name }}-
            ${{ runner.os }}-build-

      # Install Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.COMMON_DEPS }}

      # Build
      - name: Build
        run: |
          chmod +x ${{ matrix.config.build-script }}
          ./${{ matrix.config.build-script }}
        env:
          CCACHE_DIR: ~/.ccache

      # Verify Artifact ZIP Exists
      - name: Verify Artifact ZIP Exists
        run: |
          if [ -f "${{ matrix.config.artifact-zip }}" ]; then
            echo "Artifact ZIP found: ${{ matrix.config.artifact-zip }}"
            ls -la "${{ matrix.config.artifact-zip }}"
          else
            echo "Error: Artifact ZIP not found: ${{ matrix.config.artifact-zip }}"
            exit 1
          fi

      # Upload Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact-name }}
          path: ${{ matrix.config.artifact-zip }}
          retention-days: 5

  macos-build:
    name: macOS CI (Xcode)
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build macOS Project
      - name: Build macOS Project
        run: |
          chmod +x MacOSX/build-macos.sh
          cd MacOSX
          ./build-macos.sh
          cd ..  # Navigate back to the root directory
        env:
          CCACHE_DIR: ~/.ccache  # If applicable

      # Verify macOS Artifact ZIP Exists
      - name: Verify macOS Artifact ZIP Exists
        run: |
          if [ -f "MacOSX/build/Release/QSS-M-macOS.zip" ]; then
            echo "macOS Artifact ZIP found: MacOSX/build/Release/QSS-M-macOS.zip"
            ls -la MacOSX/build/Release/QSS-M-macOS.zip
          else
            echo "Error: macOS Artifact ZIP not found."
            exit 1
          fi

      # Upload macOS Artifact
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSS-M-mac
          path: MacOSX/build/Release/QSS-M-macOS.zip
          retention-days: 5

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download All Artifacts
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Generate Release Notes
      - name: Generate Release Notes
        id: notes
        run: |
          # Get the previous tag (latest tag before the current one)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)

          # Generate the sorted, unique list of the latest 50 commits
          printf "CHANGELOG<<EOF\n" >> $GITHUB_ENV
          printf "%s\n" "$(git log --no-merges -n 50 --pretty=format:"- %s (%h)" | sort | uniq)" >> $GITHUB_ENV

          # Check if there are more than 50 commits since the previous tag
          COMMIT_COUNT=$(git rev-list ${PREV_TAG}..HEAD --count)
          if [ "$COMMIT_COUNT" -gt 50 ]; then
            # Add a link to the full comparison if more than 50 commits
            echo -e "\n[View all changes](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }})" >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV

      # Create Release with Assets
      - name: Create Release with Assets
        uses: softprops/action-gh-release@v1
        with:
          name: QSS-M ${{ github.ref_name }}
          body: |
            Changes in this Release:
            ${{ env.CHANGELOG }}
          files: |
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
