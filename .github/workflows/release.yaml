on:
  push:
    tags:
      - 'v*'
  pull_request:

name: Build and Releaset

jobs:
  linux-build:
    name: Linux CI (MinGW)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo gem install apt-spy2
          sudo apt-spy2 check

          mirrors=$(apt-spy2 list | awk '{print $1}')
          for mirror in $mirrors; do
            echo "Trying mirror: $mirror"
            sudo apt-spy2 select --mirror=$mirror --commit

            if sudo apt-get update; then
              if sudo apt-get install -y mingw-w64 libsdl2-dev libmad0-dev libopus-dev libvorbis-dev zlib1g-dev libvorbisfile3 libopusfile-dev libz-mingw-w64 libz-mingw-w64-dev libcurl4-openssl-dev zip; then
                echo "Dependencies successfully installed using mirror: $mirror"
                break
              else
                echo "Failed to install dependencies from mirror: $mirror. Trying next mirror."
              fi
            else
              echo "Failed to update using mirror: $mirror. Trying next mirror."
            fi
          done
        continue-on-error: false

      - name: Build
        run: |
          chmod 755 build-linux.sh
          sudo ./build-linux.sh

      - name: Package Linux Artifact
        run: |
          mkdir -p output
          zip -r output/QSS-M-l64.zip Quake/QSS-M-l64  # Adjust path as needed

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSS-M-l64
          path: output/QSS-M-l64.zip

  macos-build:
    name: macOS CI (Xcode)
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Build macOS Project
        run: |
          cd MacOSX
          ./build-macos.sh

      - name: Package macOS Artifact
        run: |
          mkdir -p output
          zip -r output/QSS-M-mac.zip MacOSX/build/Release/*.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSS-M-mac
          path: output/QSS-M-mac.zip

  windows-build:
    name: Windows CI (MinGW Linux Cross)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [w64, w32]

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo gem install apt-spy2
          sudo apt-spy2 check

          mirrors=$(apt-spy2 list | awk '{print $1}')
          for mirror in $mirrors; do
            echo "Trying mirror: $mirror"
            sudo apt-spy2 select --mirror=$mirror --commit

            if sudo apt-get update; then
              if sudo apt-get install -y mingw-w64 libsdl2-dev libmad0-dev libopus-dev libvorbis-dev zlib1g-dev libvorbisfile3 libopusfile-dev libz-mingw-w64 libz-mingw-w64-dev libcurl4-openssl-dev zip; then
                echo "Dependencies successfully installed using mirror: $mirror"
                break
              else
                echo "Failed to install dependencies from mirror: $mirror. Trying next mirror."
              fi
            else
              echo "Failed to update using mirror: $mirror. Trying next mirror."
            fi
          done
        continue-on-error: false
      
      - name: Build Windows Project
        run: |
          chmod 755 build-${{ matrix.platform }}.sh
          sudo ./build-${{ matrix.platform }}.sh
        
      - name: Package Windows Artifact
        run: |
          mkdir -p output
          zip -r output/QSS-M-${{ matrix.platform }}.zip Quake/QSS-M-${{ matrix.platform }}  # Adjust path as needed

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSS-M-${{ matrix.platform }}
          path: output/QSS-M-${{ matrix.platform }}.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-build, macos-build, windows-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Release Notes
        id: notes
        run: |
          CHANGELOG=$(git log -n 15 --pretty=format:"- %s")
          echo "changelog<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Changes in this Release
            ${{ env.changelog }}
          draft: false
          prerelease: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: QSS-M-l64
          name: QSS-M-mac
          name: QSS-M-w64
          name: QSS-M-w32

      - name: Upload Linux Artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: output/QSS-M-l64.zip
          asset_name: QSS-M-l64.zip
          asset_content_type: application/zip

      - name: Upload macOS Artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: output/QSS-M-mac.zip
          asset_name: QSS-M-mac.zip
          asset_content_type: application/zip

      - name: Upload Windows 64-bit Artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: output/QSS-M-w64.zip
          asset_name: QSS-M-w64.zip
          asset_content_type: application/zip

      - name: Upload Windows 32-bit Artifact to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: output/QSS-M-w32.zip
          asset_name: QSS-M-w32.zip
          asset_content_type: application/zip
