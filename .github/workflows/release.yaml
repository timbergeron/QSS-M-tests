name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:

env:
  COMMON_DEPS: >-
    mingw-w64 
    libsdl2-dev 
    libmad0-dev 
    libopus-dev 
    libvorbis-dev 
    zlib1g-dev 
    libvorbisfile3 
    libopusfile-dev 
    libz-mingw-w64 
    libz-mingw-w64-dev 
    libcurl4-openssl-dev 
    zip

jobs:
  linux-windows-build:
    name: Build ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux
            build-script: build-linux.sh
            artifact-name: QSS-M-linux
            artifact-zip: Quake/QSS-M-l64.zip
          - name: Windows-64
            build-script: build-w64.sh
            artifact-name: QSS-M-w64
            artifact-zip: Quake/QSS-M-w64.zip
          - name: Windows-32
            build-script: build-w32.sh
            artifact-name: QSS-M-w32
            artifact-zip: Quake/QSS-M-w32.zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
          key: ${{ runner.os }}-build-${{ matrix.config.name }}-${{ hashFiles('**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.config.name }}-
            ${{ runner.os }}-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.COMMON_DEPS }}
          
      - name: Debug Environment
        run: |
          pwd
          ls -la
          echo "Build script: ${{ matrix.config.build-script }}"
          
      - name: Build
        run: |
          chmod +x ${{ matrix.config.build-script }}
          ./${{ matrix.config.build-script }}
        env:
          CCACHE_DIR: ~/.ccache
          
      - name: List Quake Directory
        run: |
          echo "Contents of Quake/:"
          ls -la Quake/

      - name: Verify Artifact ZIP Exists
        run: |
          if [ -f "${{ matrix.config.artifact-zip }}" ]; then
            echo "Artifact ZIP found: ${{ matrix.config.artifact-zip }}"
          else
            echo "Error: Artifact ZIP not found: ${{ matrix.config.artifact-zip }}"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact-name }}
          path: ${{ matrix.config.artifact-zip }}
          retention-days: 5

  macos-build:
    name: macOS CI (Xcode)
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Environment
        run: |
          pwd
          ls -la
          ls -la MacOSX || echo "MacOSX directory not found"

      - name: Build macOS Project
        run: |
          chmod +x MacOSX/build-macos.sh
          cd MacOSX
          ./build-macos.sh

      - name: Debug Build Output
        run: |
          echo "Checking build output directory"
          ls -la MacOSX/build/Release || echo "Release directory not found"

      - name: Verify macOS Artifact ZIP Exists
        run: |
          if [ -f "MacOSX/build/Release/QSS-M-mac.zip" ]; then
            echo "macOS Artifact ZIP found."
          else
            echo "Error: macOS Artifact ZIP not found."
            exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSS-M-mac
          path: MacOSX/build/Release/QSS-M-mac.zip
          retention-days: 5

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Downloaded Artifacts
        run: |
          pwd
          ls -R artifacts/

      - name: Generate Release Notes
        id: notes
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log --no-merges -n 15 --pretty=format:"- %s (%h)" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release with Assets
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Changes in this Release:
            ${{ env.CHANGELOG }}
          files: |
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
