name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:

env:
  COMMON_DEPS: >-
    mingw-w64 
    libsdl2-dev 
    libmad0-dev 
    libopus-dev 
    libvorbis-dev 
    zlib1g-dev 
    libvorbisfile3 
    libopusfile-dev 
    libz-mingw-w64 
    libz-mingw-w64-dev 
    libcurl4-openssl-dev 
    zip

jobs:
  linux-windows-build:
    name: Build ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux
            build-script: build-linux.sh
            artifact-name: QSS-M-linux
            artifact-zip: Quake/QSS-M-l64.zip
          - name: Windows-64
            build-script: build-w64.sh
            artifact-name: QSS-M-w64
            artifact-zip: Quake/QSS-M-w64.zip
          - name: Windows-32
            build-script: build-w32.sh
            artifact-name: QSS-M-w32
            artifact-zip: Quake/QSS-M-w32.zip

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Build Cache
      - name: Setup Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
          key: ${{ runner.os }}-build-${{ matrix.config.name }}-${{ hashFiles('**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.config.name }}-
            ${{ runner.os }}-build-

      # Install Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.COMMON_DEPS }}

      # Debug Environment
      - name: Debug Environment
        run: |
          echo "Current directory:"
          pwd
          echo "List of files:"
          ls -la
          echo "Build script: ${{ matrix.config.build-script }}"

      # Build
      - name: Build
        run: |
          chmod +x ${{ matrix.config.build-script }}
          ./${{ matrix.config.build-script }}
        env:
          CCACHE_DIR: ~/.ccache

      # List Quake Directory Contents
      - name: List Quake Directory
        run: |
          echo "Contents of Quake/:"
          ls -la Quake/

      # Verify Artifact ZIP Exists
      - name: Verify Artifact ZIP Exists
        run: |
          echo "Checking for artifact ZIP at path: ${{ matrix.config.artifact-zip }}"
          if [ -f "${{ matrix.config.artifact-zip }}" ]; then
            echo "Artifact ZIP found: ${{ matrix.config.artifact-zip }}"
            ls -la "${{ matrix.config.artifact-zip }}"
          else
            echo "Error: Artifact ZIP not found: ${{ matrix.config.artifact-zip }}"
            exit 1
          fi

      # Upload Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact-name }}
          path: ${{ matrix.config.artifact-zip }}
          retention-days: 5

  macos-build:
    name: macOS CI (Xcode)
    runs-on: macos-latest
    strategy:
      fail-fast: false

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Debug Environment
      - name: Debug Environment
        run: |
          echo "Current directory:"
          pwd
          echo "List of files in current directory:"
          ls -la
          echo "List of files in MacOSX directory:"
          ls -la MacOSX || echo "MacOSX directory not found"

      # Build macOS Project
      - name: Build macOS Project
        run: |
          chmod +x MacOSX/build-macos.sh
          cd MacOSX
          ./build-macos.sh
          cd ..  # Navigate back to the root directory
        env:
          CCACHE_DIR: ~/.ccache  # If applicable

      # Debug Build Output
      - name: Debug Build Output
        run: |
          echo "Checking build output directory:"
          ls -la MacOSX/build/Release || echo "Release directory not found"

      # List Root Directory Contents
      - name: List Current Directory
        run: |
          echo "Listing root directory contents:"
          ls -la

      # Additional Debugging: List all ZIP files
      - name: List all ZIP files
        run: |
          echo "Searching for all ZIP files:"
          find . -type f -name "*.zip"

      # Verify macOS Artifact ZIP Exists
      - name: Verify macOS Artifact ZIP Exists
        run: |
          echo "Looking for QSS-M_MacOS.zip in MacOSX/build/Release directory."
          if [ -f "MacOSX/build/Release/QSS-M_MacOS.zip" ]; then
            echo "macOS Artifact ZIP found: MacOSX/build/Release/QSS-M_MacOS.zip"
            ls -la MacOSX/build/Release/QSS-M_MacOS.zip
          else
            echo "Error: macOS Artifact ZIP not found."
            exit 1
          fi

      # Upload macOS Artifact
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSS-M-mac
          path: MacOSX/build/Release/QSS-M_MacOS.zip
          retention-days: 5

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download All Artifacts
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # List Downloaded Artifacts
      - name: List Downloaded Artifacts
        run: |
          echo "Listing downloaded artifacts:"
          pwd
          ls -R artifacts/

      # Generate Release Notes
      - name: Generate Release Notes
        id: notes
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log --no-merges -n 15 --pretty=format:"- %s (%h)" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create Release with Assets
      - name: Create Release with Assets
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Changes in this Release:
            ${{ env.CHANGELOG }}
          files: |
            artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
